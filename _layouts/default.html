<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {% seo %}
  {% feed_meta %}
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <script>
    try {
      var savedTheme = localStorage.getItem('blog-theme');
      if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  <div class="site-shell">
    <header class="site-header">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="dentiny 的博客首页">dentiny<span class="brand-dot">.</span></a>
      <nav aria-label="主导航">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>首页</a>
        <a href="{{ '/archive/' | relative_url }}"{% if page.url == '/archive/' %} aria-current="page"{% endif %}>文章</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>关于</a>
        <button class="theme-toggle" type="button" aria-label="切换深浅主题" title="切换深浅主题" hidden><span aria-hidden="true">◐</span></button>
      </nav>
    </header>
    <main id="main" tabindex="-1">{{ content }}</main>
    <footer class="site-footer">
      <span>© {{ 'now' | date: '%Y' }} dentiny · 留一点空间，给思考。</span>
      <div><a href="{{ '/feed.xml' | relative_url }}">RSS</a><a href="https://github.com/dentiny">GitHub <span aria-hidden="true">↗</span></a></div>
    </footer>
  </div>
</body>
</html>
