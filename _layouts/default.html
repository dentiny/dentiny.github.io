<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {% seo %}
  {% feed_meta %}
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-shell">
    <header class="site-header">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="dentiny home">dentiny</a>
      <nav aria-label="Main navigation">
        <a href="{{ '/archive/' | relative_url }}"{% if page.url == '/archive/' %} aria-current="page"{% endif %}>Posts</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
      </nav>
    </header>
    <main id="main" tabindex="-1">{{ content }}</main>
    <footer class="site-footer">
      <span>© {{ 'now' | date: '%Y' }} dentiny</span>
      <div><a href="https://github.com/dentiny">GitHub</a><a href="{{ '/feed.xml' | relative_url }}">RSS</a></div>
    </footer>
  </div>
</body>
</html>
