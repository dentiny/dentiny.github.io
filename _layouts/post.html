---
layout: default
---
<article class="post-page">
  <a class="back-link" href="{{ '/archive/' | relative_url }}">← All posts</a>
  <header class="page-header">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%b %-d, %Y' }}</time>
    <h1>{{ page.title | escape }}</h1>
  </header>
  <div class="prose">{{ content }}</div>
  {% if page.previous or page.next %}
  <nav class="post-navigation" aria-label="Adjacent posts">
    {% if page.previous %}<a href="{{ page.previous.url | relative_url }}">← {{ page.previous.title | escape }}</a>{% endif %}
    {% if page.next %}<a href="{{ page.next.url | relative_url }}">{{ page.next.title | escape }} →</a>{% endif %}
  </nav>
  {% endif %}
</article>
