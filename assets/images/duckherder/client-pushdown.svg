<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8C959F"/>
    </marker>
  </defs>
  <rect width="1000" height="420" rx="16" fill="#FFFDF7"/>
  <text x="40" y="46" font-size="20" font-weight="700" fill="#1F2328">On the client: send the whole query, or each table scan</text>

  <!-- Left -->
  <rect x="40" y="76" width="440" height="310" rx="14" fill="none" stroke="#B9B2A0" stroke-dasharray="7 6"/>
  <text x="60" y="102" font-size="14" font-weight="600" fill="#8C7A4B">WHOLE-QUERY PUSHDOWN</text>
  <rect x="70" y="120" width="380" height="54" rx="8" fill="#F3F1EA" stroke="#D8D3C4"/>
  <text x="260" y="152" font-size="13" text-anchor="middle" font-family="Menlo, monospace" fill="#1F2328">SELECT ... FROM dh.a JOIN dh.b</text>
  <path d="M 260 176 L 260 214" stroke="#8C959F" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="272" y="200" font-size="12" fill="#6E7781">whole query</text>
  <rect x="70" y="220" width="380" height="54" rx="8" fill="#FFF1C2" stroke="#E3B341"/>
  <text x="260" y="252" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2328">Driver runs all of it</text>

  <!-- Right -->
  <rect x="520" y="76" width="440" height="310" rx="14" fill="none" stroke="#B9B2A0" stroke-dasharray="7 6"/>
  <text x="540" y="102" font-size="14" font-weight="600" fill="#8C7A4B">PER-TABLE SCANS</text>
  <rect x="550" y="120" width="380" height="54" rx="8" fill="#F3F1EA" stroke="#D8D3C4"/>
  <text x="740" y="152" font-size="13" text-anchor="middle" font-family="Menlo, monospace" fill="#1F2328">SELECT ... FROM dh.a JOIN local_t</text>
  <path d="M 740 176 L 740 214" stroke="#8C959F" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="752" y="200" font-size="12" fill="#6E7781">one scan per table</text>
  <rect x="550" y="220" width="380" height="54" rx="8" fill="#FFF1C2" stroke="#E3B341"/>
  <text x="740" y="252" font-size="13" text-anchor="middle" font-family="Menlo, monospace" fill="#1F2328">SELECT x, y FROM a WHERE x &gt; 10</text>
  <path d="M 740 276 L 740 314" stroke="#8C959F" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="752" y="300" font-size="12" fill="#6E7781">rows</text>
  <rect x="550" y="320" width="380" height="46" rx="8" fill="#F3F1EA" stroke="#D8D3C4"/>
  <text x="740" y="348" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2328">Client joins locally</text>
</svg>
