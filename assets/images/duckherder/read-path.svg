<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8C959F"/>
    </marker>
  </defs>
  <rect width="1000" height="480" rx="16" fill="#FFFDF7"/>
  <text x="40" y="46" font-size="20" font-weight="700" fill="#1F2328">The read path</text>

  <!-- Small -->
  <rect x="40" y="76" width="440" height="370" rx="14" fill="none" stroke="#B9B2A0" stroke-dasharray="7 6"/>
  <text x="60" y="102" font-size="14" font-weight="600" fill="#8C7A4B">SMALL</text>
  <g font-size="15" text-anchor="middle">
    <rect x="70" y="124" width="380" height="60" rx="10" fill="#F3F1EA" stroke="#D8D3C4"/>
    <text x="260" y="159" font-weight="700" fill="#1F2328">Client</text>
    <rect x="70" y="224" width="380" height="60" rx="10" fill="#FFF1C2" stroke="#E3B341"/>
    <text x="260" y="250" font-weight="700" fill="#1F2328">Driver</text>
    <text x="260" y="270" font-size="12" fill="#57606A">runs it alone</text>
    <rect x="70" y="324" width="380" height="60" rx="10" fill="#E3F4E6" stroke="#7CC08A"/>
    <text x="260" y="359" font-weight="700" fill="#1F2328">Bucket</text>
  </g>
  <g stroke="#8C959F" stroke-width="2" marker-end="url(#arrow)">
    <line x1="260" y1="186" x2="260" y2="218"/>
    <line x1="260" y1="286" x2="260" y2="318"/>
  </g>

  <!-- Large -->
  <rect x="520" y="76" width="440" height="370" rx="14" fill="none" stroke="#B9B2A0" stroke-dasharray="7 6"/>
  <text x="540" y="102" font-size="14" font-weight="600" fill="#8C7A4B">LARGE</text>
  <g font-size="15" text-anchor="middle">
    <rect x="550" y="124" width="380" height="50" rx="10" fill="#FFF1C2" stroke="#E3B341"/>
    <text x="740" y="155" font-weight="700" fill="#1F2328">Driver</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#1F2328">
    <rect x="550" y="196" width="56" height="34" rx="5" fill="#DDE8FF" stroke="#7FA6EE"/><text x="578" y="218">RG 0</text>
    <rect x="610" y="196" width="56" height="34" rx="5" fill="#DDE8FF" stroke="#7FA6EE"/><text x="638" y="218">RG 1</text>
    <rect x="678" y="196" width="56" height="34" rx="5" fill="#FFE1D6" stroke="#E8957A"/><text x="706" y="218">RG 2</text>
    <rect x="738" y="196" width="56" height="34" rx="5" fill="#FFE1D6" stroke="#E8957A"/><text x="766" y="218">RG 3</text>
    <rect x="806" y="196" width="56" height="34" rx="5" fill="#E8DDFF" stroke="#A88BE6"/><text x="834" y="218">RG 4</text>
    <rect x="866" y="196" width="56" height="34" rx="5" fill="#E8DDFF" stroke="#A88BE6"/><text x="894" y="218">RG 5</text>
  </g>
  <g font-size="13" text-anchor="middle">
    <rect x="550" y="270" width="116" height="62" rx="8" fill="#DDE8FF" stroke="#7FA6EE"/>
    <text x="608" y="295" font-weight="700" fill="#1F2328">Worker 1</text>
    <text x="608" y="315" font-size="11" fill="#57606A">partial</text>
    <rect x="682" y="270" width="116" height="62" rx="8" fill="#FFE1D6" stroke="#E8957A"/>
    <text x="740" y="295" font-weight="700" fill="#1F2328">Worker 2</text>
    <text x="740" y="315" font-size="11" fill="#57606A">partial</text>
    <rect x="814" y="270" width="116" height="62" rx="8" fill="#E8DDFF" stroke="#A88BE6"/>
    <text x="872" y="295" font-weight="700" fill="#1F2328">Worker 3</text>
    <text x="872" y="315" font-size="11" fill="#57606A">partial</text>
  </g>
  <g stroke="#8C959F" stroke-width="2" marker-end="url(#arrow)">
    <line x1="608" y1="232" x2="608" y2="264"/>
    <line x1="740" y1="232" x2="740" y2="264"/>
    <line x1="872" y1="232" x2="872" y2="264"/>
    <line x1="608" y1="334" x2="700" y2="370"/>
    <line x1="740" y1="334" x2="740" y2="370"/>
    <line x1="872" y1="334" x2="780" y2="370"/>
  </g>
  <g font-size="15" text-anchor="middle">
    <rect x="550" y="376" width="380" height="50" rx="10" fill="#FFF1C2" stroke="#E3B341"/>
    <text x="740" y="407" font-weight="700" fill="#1F2328">Driver merges</text>
  </g>
</svg>
