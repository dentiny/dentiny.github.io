<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8C959F"/>
    </marker>
  </defs>
  <rect width="1000" height="340" rx="16" fill="#FFFDF7"/>
  <text x="40" y="46" font-size="20" font-weight="700" fill="#1F2328">The write path</text>

  <g font-size="15" text-anchor="middle">
    <rect x="40" y="90" width="200" height="80" rx="10" fill="#F3F1EA" stroke="#D8D3C4"/>
    <text x="140" y="124" font-weight="700" fill="#1F2328">Client</text>
    <text x="140" y="146" font-size="12" fill="#57606A">sends the statement</text>

    <rect x="300" y="90" width="200" height="80" rx="10" fill="#FFF1C2" stroke="#E3B341"/>
    <text x="400" y="124" font-weight="700" fill="#1F2328">Driver</text>
    <text x="400" y="146" font-size="12" fill="#57606A">plain DuckDB</text>

    <rect x="560" y="90" width="180" height="80" rx="10" fill="#F3F1EA" stroke="#D8D3C4"/>
    <text x="650" y="124" font-weight="700" fill="#1F2328">duckdb_objfs://</text>
    <text x="650" y="146" font-size="12" fill="#57606A">SlateDB</text>

    <rect x="800" y="90" width="160" height="80" rx="10" fill="#E3F4E6" stroke="#7CC08A"/>
    <text x="880" y="136" font-weight="700" fill="#1F2328">Bucket</text>
  </g>
  <g stroke="#8C959F" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="242" y1="130" x2="294" y2="130"/>
    <line x1="502" y1="130" x2="554" y2="130"/>
    <line x1="742" y1="130" x2="794" y2="130"/>
  </g>
  <text x="268" y="120" font-size="12" fill="#6E7781" text-anchor="middle">Flight</text>

  <!-- Workers -->
  <rect x="560" y="240" width="400" height="64" rx="10" fill="#DDE8FF" stroke="#7FA6EE"/>
  <text x="760" y="278" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2328">Workers (read-only)</text>
  <path d="M 880 172 L 880 234" stroke="#8C959F" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="890" y="208" font-size="12" fill="#6E7781">commits</text>

  <rect x="40" y="240" width="200" height="64" rx="10" fill="#FBE9E4" stroke="#E8957A"/>
  <text x="140" y="268" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2328">Safe to retry</text>
  <text x="140" y="288" font-size="12" text-anchor="middle" fill="#57606A">replayed, not rerun</text>
</svg>
