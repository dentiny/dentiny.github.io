<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8C959F"/>
    </marker>
  </defs>
  <rect width="1000" height="400" rx="16" fill="#FFFDF7"/>
  <text x="40" y="46" font-size="20" font-weight="700" fill="#1F2328">Each worker reads only its row groups</text>

  <g font-size="11" text-anchor="middle" fill="#1F2328">
    <rect x="40"  y="80" width="72" height="44" rx="5" fill="#DDE8FF" stroke="#7FA6EE"/><text x="76"  y="107">RG 0</text>
    <rect x="116" y="80" width="72" height="44" rx="5" fill="#DDE8FF" stroke="#7FA6EE"/><text x="152" y="107">RG 1</text>
    <rect x="192" y="80" width="72" height="44" rx="5" fill="#DDE8FF" stroke="#7FA6EE"/><text x="228" y="107">RG 2</text>
    <rect x="268" y="80" width="72" height="44" rx="5" fill="#DDE8FF" stroke="#7FA6EE"/><text x="304" y="107">RG 3</text>
    <rect x="348" y="80" width="72" height="44" rx="5" fill="#FFE1D6" stroke="#E8957A"/><text x="384" y="107">RG 4</text>
    <rect x="424" y="80" width="72" height="44" rx="5" fill="#FFE1D6" stroke="#E8957A"/><text x="460" y="107">RG 5</text>
    <rect x="500" y="80" width="72" height="44" rx="5" fill="#FFE1D6" stroke="#E8957A"/><text x="536" y="107">RG 6</text>
    <rect x="576" y="80" width="72" height="44" rx="5" fill="#FFE1D6" stroke="#E8957A"/><text x="612" y="107">RG 7</text>
    <rect x="656" y="80" width="72" height="44" rx="5" fill="#E8DDFF" stroke="#A88BE6"/><text x="692" y="107">RG 8</text>
    <rect x="732" y="80" width="72" height="44" rx="5" fill="#E8DDFF" stroke="#A88BE6"/><text x="768" y="107">RG 9</text>
    <rect x="808" y="80" width="72" height="44" rx="5" fill="#E8DDFF" stroke="#A88BE6"/><text x="844" y="107">RG 10</text>
    <rect x="884" y="80" width="76" height="44" rx="5" fill="#E8DDFF" stroke="#A88BE6"/><text x="922" y="107">RG 11</text>
  </g>

  <g font-size="13" fill="#1F2328">
    <rect x="40" y="140" width="300" height="56" rx="8" fill="#DDE8FF" stroke="#7FA6EE"/>
    <text x="54" y="162" font-weight="700">Task 1</text>
    <text x="54" y="182" font-size="12" font-family="Menlo, monospace">rowid &lt; 491520</text>
    <rect x="348" y="140" width="300" height="56" rx="8" fill="#FFE1D6" stroke="#E8957A"/>
    <text x="362" y="162" font-weight="700">Task 2</text>
    <text x="362" y="182" font-size="12" font-family="Menlo, monospace">491520 &lt;= rowid &lt; 983040</text>
    <rect x="656" y="140" width="304" height="56" rx="8" fill="#E8DDFF" stroke="#A88BE6"/>
    <text x="670" y="162" font-weight="700">Task 3</text>
    <text x="670" y="182" font-size="12" font-family="Menlo, monospace">rowid &gt;= 983040</text>
  </g>

  <!-- Worker 2 zoom -->
  <path d="M 498 198 L 498 236" stroke="#8C959F" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="242" width="920" height="124" rx="14" fill="#EEF3FF" stroke="#7FA6EE"/>
  <text x="60" y="268" font-size="14" font-weight="600" fill="#3E63B8">WORKER 2</text>
  <g font-size="11" text-anchor="middle">
    <rect x="60"  y="290" width="60" height="34" rx="5" fill="#F3F1EA" stroke="#D8D3C4" stroke-dasharray="4 3"/><text x="90"  y="311" fill="#8C959F">RG 0-3</text>
    <rect x="130" y="290" width="60" height="34" rx="5" fill="#FFE1D6" stroke="#E8957A"/><text x="160" y="311" fill="#1F2328">RG 4</text>
    <rect x="196" y="290" width="60" height="34" rx="5" fill="#FFE1D6" stroke="#E8957A"/><text x="226" y="311" fill="#1F2328">RG 5</text>
    <rect x="262" y="290" width="60" height="34" rx="5" fill="#FFE1D6" stroke="#E8957A"/><text x="292" y="311" fill="#1F2328">RG 6</text>
    <rect x="328" y="290" width="60" height="34" rx="5" fill="#FFE1D6" stroke="#E8957A"/><text x="358" y="311" fill="#1F2328">RG 7</text>
    <rect x="398" y="290" width="60" height="34" rx="5" fill="#F3F1EA" stroke="#D8D3C4" stroke-dasharray="4 3"/><text x="428" y="311" fill="#8C959F">RG 8-11</text>
  </g>
  <text x="60" y="350" font-size="12" fill="#8C959F">dashed: skipped</text>
  <path d="M 464 307 L 494 307" stroke="#8C959F" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="500" y="282" width="440" height="50" rx="10" fill="#E3F4E6" stroke="#7CC08A"/>
  <text x="720" y="312" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2328">Bucket: blocks of RG 4-7 only</text>
</svg>
