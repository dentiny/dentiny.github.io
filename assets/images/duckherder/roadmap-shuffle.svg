<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8C959F"/>
    </marker>
  </defs>
  <rect width="1000" height="380" rx="16" fill="#FFFDF7"/>
  <text x="40" y="46" font-size="20" font-weight="700" fill="#1F2328">Next: Parquet as a source, and a shuffle</text>

  <!-- read_parquet -->
  <rect x="40" y="76" width="440" height="270" rx="14" fill="none" stroke="#B9B2A0" stroke-dasharray="7 6"/>
  <text x="60" y="102" font-size="14" font-weight="600" fill="#8C7A4B">DISTRIBUTED read_parquet</text>
  <rect x="70" y="118" width="380" height="40" rx="8" fill="#FFF1C2" stroke="#E3B341"/>
  <text x="260" y="143" font-size="13" text-anchor="middle" font-family="Menlo, monospace" fill="#1F2328">read_parquet('s3://lake/*')</text>
  <g font-size="11" text-anchor="middle" fill="#1F2328">
    <rect x="70"  y="186" width="88" height="30" rx="5" fill="#DDE8FF" stroke="#7FA6EE"/><text x="114" y="205">part-0</text>
    <rect x="166" y="186" width="88" height="30" rx="5" fill="#DDE8FF" stroke="#7FA6EE"/><text x="210" y="205">part-1</text>
    <rect x="266" y="186" width="88" height="30" rx="5" fill="#FFE1D6" stroke="#E8957A"/><text x="310" y="205">part-2</text>
    <rect x="362" y="186" width="88" height="30" rx="5" fill="#E8DDFF" stroke="#A88BE6"/><text x="406" y="205">part-3</text>
  </g>
  <g font-size="12" text-anchor="middle">
    <rect x="70"  y="246" width="116" height="62" rx="8" fill="#DDE8FF" stroke="#7FA6EE"/><text x="128" y="270" font-weight="700" fill="#1F2328">Worker 1</text><text x="128" y="290" font-size="11" fill="#57606A">cache_httpfs</text>
    <rect x="202" y="246" width="116" height="62" rx="8" fill="#FFE1D6" stroke="#E8957A"/><text x="260" y="270" font-weight="700" fill="#1F2328">Worker 2</text><text x="260" y="290" font-size="11" fill="#57606A">cache_httpfs</text>
    <rect x="334" y="246" width="116" height="62" rx="8" fill="#E8DDFF" stroke="#A88BE6"/><text x="392" y="270" font-weight="700" fill="#1F2328">Worker 3</text><text x="392" y="290" font-size="11" fill="#57606A">cache_httpfs</text>
  </g>
  <g stroke="#8C959F" stroke-width="2" marker-end="url(#arrow)">
    <line x1="160" y1="218" x2="130" y2="240"/>
    <line x1="310" y1="218" x2="262" y2="240"/>
    <line x1="406" y1="218" x2="394" y2="240"/>
  </g>

  <!-- shuffle -->
  <rect x="520" y="76" width="440" height="270" rx="14" fill="none" stroke="#B9B2A0" stroke-dasharray="7 6"/>
  <text x="540" y="102" font-size="14" font-weight="600" fill="#8C7A4B">SHUFFLE BY HASH</text>
  <g font-size="12" text-anchor="middle">
    <rect x="550" y="122" width="116" height="48" rx="8" fill="#DDE8FF" stroke="#7FA6EE"/><text x="608" y="151" font-weight="700" fill="#1F2328">Worker 1</text>
    <rect x="682" y="122" width="116" height="48" rx="8" fill="#FFE1D6" stroke="#E8957A"/><text x="740" y="151" font-weight="700" fill="#1F2328">Worker 2</text>
    <rect x="814" y="122" width="116" height="48" rx="8" fill="#E8DDFF" stroke="#A88BE6"/><text x="872" y="151" font-weight="700" fill="#1F2328">Worker 3</text>
    <rect x="550" y="260" width="116" height="48" rx="8" fill="#DDE8FF" stroke="#7FA6EE"/><text x="608" y="289" font-weight="700" fill="#1F2328">hash 0</text>
    <rect x="682" y="260" width="116" height="48" rx="8" fill="#FFE1D6" stroke="#E8957A"/><text x="740" y="289" font-weight="700" fill="#1F2328">hash 1</text>
    <rect x="814" y="260" width="116" height="48" rx="8" fill="#E8DDFF" stroke="#A88BE6"/><text x="872" y="289" font-weight="700" fill="#1F2328">hash 2</text>
  </g>
  <g stroke="#8C959F" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="608" y1="172" x2="608" y2="254"/><line x1="608" y1="172" x2="736" y2="254"/><line x1="608" y1="172" x2="866" y2="254"/>
    <line x1="740" y1="172" x2="614" y2="254"/><line x1="740" y1="172" x2="740" y2="254"/><line x1="740" y1="172" x2="870" y2="254"/>
    <line x1="872" y1="172" x2="618" y2="254"/><line x1="872" y1="172" x2="744" y2="254"/><line x1="872" y1="172" x2="874" y2="254"/>
  </g>
</svg>
