<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8C959F"/>
    </marker>
  </defs>
  <rect width="1000" height="470" rx="16" fill="#FFFDF7"/>
  <text x="40" y="46" font-size="20" font-weight="700" fill="#1F2328">Cutting a worker fragment out of the plan</text>

  <!-- BEFORE -->
  <text x="60" y="94" font-size="14" font-weight="600" fill="#8C7A4B">OPTIMIZED PLAN</text>
  <g font-size="13" text-anchor="middle" fill="#1F2328">
    <rect x="80" y="110" width="220" height="38" rx="7" fill="#F3F1EA" stroke="#D8D3C4"/><text x="190" y="134">ORDER BY</text>
    <rect x="80" y="174" width="220" height="38" rx="7" fill="#F3F1EA" stroke="#D8D3C4"/><text x="190" y="198">PROJECTION</text>
    <rect x="80" y="238" width="220" height="38" rx="7" fill="#FFE9A8" stroke="#E3B341" stroke-width="2"/><text x="190" y="262" font-weight="700">AGGREGATE</text>
    <rect x="80" y="302" width="220" height="38" rx="7" fill="#F3F1EA" stroke="#D8D3C4"/><text x="190" y="326">HASH JOIN</text>
    <rect x="40" y="368" width="140" height="38" rx="7" fill="#F3F1EA" stroke="#D8D3C4"/><text x="110" y="392">SCAN lineitem</text>
    <rect x="200" y="368" width="140" height="38" rx="7" fill="#F3F1EA" stroke="#D8D3C4"/><text x="270" y="392">SCAN orders</text>
  </g>
  <g stroke="#8C959F" stroke-width="2">
    <line x1="190" y1="148" x2="190" y2="174"/>
    <line x1="190" y1="212" x2="190" y2="238"/>
    <line x1="190" y1="276" x2="190" y2="302"/>
    <line x1="160" y1="340" x2="110" y2="368"/>
    <line x1="220" y1="340" x2="270" y2="368"/>
  </g>
  <rect x="30" y="228" width="320" height="190" rx="12" fill="none" stroke="#E3B341" stroke-width="2" stroke-dasharray="6 5"/>

  <path d="M 370 280 L 420 280" stroke="#8C959F" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- AFTER: driver -->
  <rect x="430" y="76" width="250" height="360" rx="14" fill="#FFF8E0" stroke="#E3B341"/>
  <text x="445" y="100" font-size="14" font-weight="600" fill="#8C7A4B">DRIVER</text>
  <g font-size="13" text-anchor="middle" fill="#1F2328">
    <rect x="450" y="116" width="210" height="38" rx="7" fill="#F3F1EA" stroke="#D8D3C4"/><text x="555" y="140">ORDER BY</text>
    <rect x="450" y="176" width="210" height="38" rx="7" fill="#F3F1EA" stroke="#D8D3C4"/><text x="555" y="200">PROJECTION</text>
    <rect x="450" y="236" width="210" height="44" rx="7" fill="#FFFDF7" stroke="#E3B341"/>
    <text x="555" y="255" font-weight="700">PROJECTION</text><text x="555" y="272" font-size="11" fill="#57606A">avg = sum / count</text>
    <rect x="450" y="302" width="210" height="38" rx="7" fill="#FFFDF7" stroke="#E3B341"/><text x="555" y="326" font-weight="700">MERGE AGGREGATE</text>
    <rect x="450" y="362" width="210" height="38" rx="7" fill="#DDE8FF" stroke="#7FA6EE" stroke-width="2"/><text x="555" y="386" font-weight="700">worker_fragment</text>
  </g>
  <g stroke="#8C959F" stroke-width="2">
    <line x1="555" y1="154" x2="555" y2="176"/>
    <line x1="555" y1="214" x2="555" y2="236"/>
    <line x1="555" y1="280" x2="555" y2="302"/>
    <line x1="555" y1="340" x2="555" y2="362"/>
  </g>

  <!-- AFTER: workers -->
  <path d="M 662 381 C 690 381, 690 280, 716 280" stroke="#8C959F" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="720" y="76" width="250" height="360" rx="14" fill="#EEF3FF" stroke="#7FA6EE"/>
  <text x="735" y="100" font-size="14" font-weight="600" fill="#3E63B8">EACH WORKER</text>
  <g font-size="13" text-anchor="middle" fill="#1F2328">
    <rect x="740" y="116" width="210" height="38" rx="7" fill="#FFFDF7" stroke="#7FA6EE"/><text x="845" y="140" font-weight="700">PROJECTION</text>
    <rect x="740" y="176" width="210" height="44" rx="7" fill="#FFFDF7" stroke="#7FA6EE"/>
    <text x="845" y="195" font-weight="700">PARTIAL AGGREGATE</text><text x="845" y="212" font-size="11" fill="#57606A">sum, count</text>
    <rect x="740" y="242" width="210" height="38" rx="7" fill="#F3F1EA" stroke="#D8D3C4"/><text x="845" y="266">HASH JOIN</text>
    <rect x="730" y="304" width="112" height="52" rx="7" fill="#DDE8FF" stroke="#7FA6EE"/>
    <text x="786" y="326">SCAN lineitem</text><text x="786" y="344" font-size="11" fill="#57606A">range i</text>
    <rect x="852" y="304" width="108" height="52" rx="7" fill="#F3F1EA" stroke="#D8D3C4"/>
    <text x="906" y="326">SCAN orders</text><text x="906" y="344" font-size="11" fill="#57606A">all</text>
  </g>
  <g stroke="#8C959F" stroke-width="2">
    <line x1="845" y1="154" x2="845" y2="176"/>
    <line x1="845" y1="220" x2="845" y2="242"/>
    <line x1="815" y1="280" x2="786" y2="304"/>
    <line x1="875" y1="280" x2="906" y2="304"/>
  </g>
</svg>
