<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8C959F"/>
    </marker>
  </defs>
  <rect width="1000" height="460" rx="16" fill="#FFFDF7"/>
  <text x="40" y="46" font-size="20" font-weight="700" fill="#1F2328">The benchmark rig</text>

  <!-- CPU map -->
  <text x="40" y="84" font-size="14" font-weight="600" fill="#8C7A4B">CPU PINNING</text>
  <g font-size="12" text-anchor="middle">
    <rect x="40"  y="98" width="140" height="56" rx="8" fill="#F3F1EA" stroke="#D8D3C4"/>
    <text x="110" y="122" font-weight="700" fill="#1F2328">Client</text><text x="110" y="140" fill="#57606A">CPU 0-1</text>
    <rect x="190" y="98" width="140" height="56" rx="8" fill="#DDE8FF" stroke="#7FA6EE"/>
    <text x="260" y="122" font-weight="700" fill="#1F2328">Worker 1</text><text x="260" y="140" fill="#57606A">CPU 2-3</text>
    <rect x="340" y="98" width="140" height="56" rx="8" fill="#DDE8FF" stroke="#7FA6EE"/>
    <text x="410" y="122" font-weight="700" fill="#1F2328">Worker 2</text><text x="410" y="140" fill="#57606A">CPU 4-5</text>
    <rect x="490" y="98" width="140" height="56" rx="8" fill="#DDE8FF" stroke="#7FA6EE"/>
    <text x="560" y="122" font-weight="700" fill="#1F2328">Worker 3</text><text x="560" y="140" fill="#57606A">CPU 6-7</text>
    <rect x="640" y="98" width="140" height="56" rx="8" fill="#FFF1C2" stroke="#E3B341"/>
    <text x="710" y="122" font-weight="700" fill="#1F2328">Driver</text><text x="710" y="140" fill="#57606A">CPU 8-9</text>
    <rect x="790" y="98" width="170" height="56" rx="8" fill="#E3F4E6" stroke="#7CC08A"/>
    <text x="875" y="122" font-weight="700" fill="#1F2328">RustFS</text><text x="875" y="140" fill="#57606A">CPU 16-19</text>
  </g>

  <!-- Latency injection stack -->
  <text x="40" y="200" font-size="14" font-weight="600" fill="#8C7A4B">STORAGE STACK</text>
  <g font-size="13" text-anchor="middle">
    <rect x="40" y="214" width="420" height="40" rx="8" fill="#F3F1EA" stroke="#D8D3C4"/><text x="250" y="239" fill="#1F2328">DuckDB</text>
    <rect x="40" y="266" width="420" height="54" rx="8" fill="#FBE9E4" stroke="#E8957A"/>
    <text x="250" y="289" font-weight="700" fill="#1F2328">latency_inject_fs</text>
    <text x="250" y="308" font-size="12" fill="#57606A">~30 ms per read</text>
    <rect x="40" y="332" width="420" height="40" rx="8" fill="#F3F1EA" stroke="#D8D3C4"/><text x="250" y="357" fill="#1F2328">SlateDB</text>
    <rect x="40" y="384" width="420" height="40" rx="8" fill="#E3F4E6" stroke="#7CC08A"/><text x="250" y="409" fill="#1F2328">RustFS bucket</text>
  </g>
  <g stroke="#8C959F" stroke-width="2" marker-end="url(#arrow)">
    <line x1="250" y1="256" x2="250" y2="262"/>
    <line x1="250" y1="322" x2="250" y2="328"/>
    <line x1="250" y1="374" x2="250" y2="380"/>
  </g>

  <!-- Run loop -->
  <text x="520" y="200" font-size="14" font-weight="600" fill="#8C7A4B">ONE RUN</text>
  <g font-size="13" fill="#1F2328">
    <rect x="520" y="214" width="440" height="36" rx="8" fill="#F3F1EA" stroke="#D8D3C4"/><text x="536" y="237">1. Load TPC-H</text>
    <rect x="520" y="260" width="440" height="36" rx="8" fill="#F3F1EA" stroke="#D8D3C4"/><text x="536" y="283">2. Start 0 or 3 workers</text>
    <rect x="520" y="306" width="440" height="36" rx="8" fill="#F3F1EA" stroke="#D8D3C4"/><text x="536" y="329">3. Verify against DuckDB</text>
    <rect x="520" y="352" width="440" height="36" rx="8" fill="#FBE9E4" stroke="#E8957A"/><text x="536" y="375">4. Restart, run each query cold</text>
    <rect x="520" y="398" width="440" height="36" rx="8" fill="#F3F1EA" stroke="#D8D3C4"/><text x="536" y="421">5. Record medians</text>
  </g>
</svg>
