<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="1000" height="420" rx="16" fill="#FFFDF7"/>
  <text x="40" y="46" font-size="20" font-weight="700" fill="#1F2328">Is one task faster than one node? (3 workers)</text>

  <!-- Example A -->
  <text x="40" y="92" font-size="14" font-weight="600" fill="#8C7A4B">A: 30 GB JOIN 1 GB</text>
  <text x="40" y="130" font-size="13" fill="#1F2328">One node</text>
  <rect x="160" y="112" width="600" height="28" fill="#DDE8FF" stroke="#7FA6EE"/><text x="460" y="131" font-size="12" text-anchor="middle">30</text>
  <rect x="760" y="112" width="20" height="28" fill="#F3F1EA" stroke="#B9B2A0"/>
  <text x="790" y="131" font-size="13" fill="#1F2328">31 GB</text>
  <text x="40" y="174" font-size="13" fill="#1F2328">One task</text>
  <rect x="160" y="156" width="200" height="28" fill="#DDE8FF" stroke="#7FA6EE"/><text x="260" y="175" font-size="12" text-anchor="middle">10</text>
  <rect x="360" y="156" width="40" height="28" fill="#F3F1EA" stroke="#B9B2A0"/><text x="380" y="175" font-size="11" text-anchor="middle">2</text>
  <text x="410" y="175" font-size="13" fill="#1F2328">12 GB</text>
  <rect x="560" y="158" width="200" height="26" rx="13" fill="#E3F4E6" stroke="#7CC08A"/>
  <text x="660" y="176" font-size="13" font-weight="700" text-anchor="middle" fill="#2E7D32">split</text>

  <!-- Example B -->
  <text x="40" y="240" font-size="14" font-weight="600" fill="#8C7A4B">B: 30 GB JOIN 20 GB</text>
  <text x="40" y="278" font-size="13" fill="#1F2328">One node</text>
  <rect x="160" y="260" width="600" height="28" fill="#DDE8FF" stroke="#7FA6EE"/><text x="460" y="279" font-size="12" text-anchor="middle">30</text>
  <rect x="160" y="294" width="400" height="22" fill="#F3F1EA" stroke="#B9B2A0"/><text x="360" y="310" font-size="12" text-anchor="middle">20</text>
  <text x="790" y="279" font-size="13" fill="#1F2328">50 GB</text>
  <text x="40" y="358" font-size="13" fill="#1F2328">One task</text>
  <rect x="160" y="340" width="200" height="28" fill="#DDE8FF" stroke="#7FA6EE"/><text x="260" y="359" font-size="12" text-anchor="middle">10</text>
  <rect x="360" y="340" width="400" height="28" fill="#F3F1EA" stroke="#B9B2A0"/><text x="560" y="359" font-size="12" text-anchor="middle">20 &#215; 2</text>
  <text x="790" y="359" font-size="13" fill="#1F2328">50 GB</text>
  <rect x="560" y="382" width="200" height="26" rx="13" fill="#FBE9E4" stroke="#E8957A"/>
  <text x="660" y="400" font-size="13" font-weight="700" text-anchor="middle" fill="#B4553F">stay local</text>
</svg>
