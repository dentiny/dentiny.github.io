<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8C959F"/>
    </marker>
  </defs>
  <rect width="1000" height="560" rx="16" fill="#FFFDF7"/>
  <text x="40" y="46" font-size="20" font-weight="700" fill="#1F2328">Should this query fan out?</text>

  <g font-size="14" font-weight="700" text-anchor="middle" fill="#1F2328">
    <rect x="160" y="74" width="400" height="44" rx="10" fill="#FFF1C2" stroke="#E3B341"/><text x="360" y="101">Read-only client with workers?</text>
    <rect x="160" y="146" width="400" height="44" rx="10" fill="#FFF1C2" stroke="#E3B341"/><text x="360" y="173">Aggregate, Join or scan to cut?</text>
    <rect x="160" y="218" width="400" height="44" rx="10" fill="#FFF1C2" stroke="#E3B341"/><text x="360" y="245">Workers can read its tables?</text>
    <rect x="160" y="290" width="400" height="44" rx="10" fill="#FFF1C2" stroke="#E3B341"/><text x="360" y="317">Result stays the same?</text>
    <rect x="160" y="362" width="400" height="44" rx="10" fill="#FFF1C2" stroke="#E3B341"/><text x="360" y="389">Two or more tasks?</text>
    <rect x="160" y="434" width="400" height="44" rx="10" fill="#FFF1C2" stroke="#E3B341"/><text x="360" y="461">Join: worth it, fits in memory?</text>
  </g>
  <g stroke="#8C959F" stroke-width="2" marker-end="url(#arrow)">
    <line x1="360" y1="120" x2="360" y2="140"/>
    <line x1="360" y1="192" x2="360" y2="212"/>
    <line x1="360" y1="264" x2="360" y2="284"/>
    <line x1="360" y1="336" x2="360" y2="356"/>
    <line x1="360" y1="408" x2="360" y2="428"/>
    <line x1="360" y1="480" x2="360" y2="500"/>
  </g>

  <!-- "No" exits -->
  <g stroke="#C9A6A6" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M 562 96 L 694 96"/>
    <path d="M 562 168 L 694 168"/>
    <path d="M 562 240 L 694 240"/>
    <path d="M 562 312 L 694 312"/>
    <path d="M 562 384 L 694 384"/>
    <path d="M 562 456 L 694 456"/>
  </g>
  <g font-size="12" fill="#B4553F" font-weight="600">
    <text x="574" y="88">no</text><text x="574" y="160">no</text><text x="574" y="232">no</text>
    <text x="574" y="304">no</text><text x="574" y="376">no</text><text x="574" y="448">no</text>
  </g>
  <g font-size="13" fill="#1F2328" text-anchor="middle">
    <rect x="700" y="76" width="260" height="40" rx="8" fill="#F3F1EA" stroke="#D8D3C4"/><text x="830" y="101">Driver runs it</text>
    <rect x="700" y="148" width="260" height="40" rx="8" fill="#F3F1EA" stroke="#D8D3C4"/><text x="830" y="173">Driver runs it</text>
    <rect x="700" y="220" width="260" height="112" rx="8" fill="#F3F1EA" stroke="#D8D3C4"/><text x="830" y="281">Try the operator below</text>
    <rect x="700" y="364" width="260" height="40" rx="8" fill="#F3F1EA" stroke="#D8D3C4"/><text x="830" y="389">One task, or driver</text>
    <rect x="700" y="436" width="260" height="40" rx="8" fill="#F3F1EA" stroke="#D8D3C4"/><text x="830" y="461">Driver runs the Join</text>
  </g>

  <rect x="160" y="504" width="400" height="40" rx="10" fill="#E3F4E6" stroke="#7CC08A" stroke-width="2"/>
  <text x="360" y="529" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2328">Fan out</text>
</svg>
