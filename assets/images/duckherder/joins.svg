<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="1000" height="380" rx="16" fill="#FFFDF7"/>
  <text x="40" y="46" font-size="20" font-weight="700" fill="#1F2328">Two ways to split a Join without a shuffle</text>

  <!-- Left: split one, replicate the rest -->
  <rect x="40" y="76" width="440" height="270" rx="14" fill="none" stroke="#B9B2A0" stroke-dasharray="7 6"/>
  <text x="60" y="102" font-size="14" font-weight="600" fill="#8C7A4B">SPLIT ONE, REPLICATE THE REST</text>

  <g font-size="12" text-anchor="middle" fill="#1F2328">
    <text x="80" y="146" text-anchor="start" font-weight="600">lineitem</text>
    <rect x="160" y="132" width="96" height="22" rx="4" fill="#DDE8FF" stroke="#7FA6EE"/><text x="208" y="147">RG 0-3</text>
    <rect x="262" y="132" width="96" height="22" rx="4" fill="#FFE1D6" stroke="#E8957A"/><text x="310" y="147">RG 4-7</text>
    <rect x="364" y="132" width="96" height="22" rx="4" fill="#E8DDFF" stroke="#A88BE6"/><text x="412" y="147">RG 8-11</text>
    <text x="80" y="186" text-anchor="start" font-weight="600">part</text>
    <rect x="160" y="172" width="300" height="22" rx="4" fill="#F3F1EA" stroke="#D8D3C4"/><text x="310" y="187">all</text>
  </g>
  <g font-size="12" text-anchor="middle">
    <rect x="70" y="230" width="124" height="70" rx="8" fill="#DDE8FF" stroke="#7FA6EE"/>
    <text x="132" y="258" font-weight="700" fill="#1F2328">Task 1</text>
    <text x="132" y="280" fill="#57606A">RG 0-3 + part</text>
    <rect x="198" y="230" width="124" height="70" rx="8" fill="#FFE1D6" stroke="#E8957A"/>
    <text x="260" y="258" font-weight="700" fill="#1F2328">Task 2</text>
    <text x="260" y="280" fill="#57606A">RG 4-7 + part</text>
    <rect x="326" y="230" width="124" height="70" rx="8" fill="#E8DDFF" stroke="#A88BE6"/>
    <text x="388" y="258" font-weight="700" fill="#1F2328">Task 3</text>
    <text x="388" y="280" fill="#57606A">RG 8-11 + part</text>
  </g>

  <!-- Right: co-partition by key ranges -->
  <rect x="520" y="76" width="440" height="270" rx="14" fill="none" stroke="#B9B2A0" stroke-dasharray="7 6"/>
  <text x="540" y="102" font-size="14" font-weight="600" fill="#8C7A4B">CO-PARTITION BY KEY RANGE</text>

  <g font-size="12" text-anchor="middle" fill="#1F2328">
    <text x="560" y="146" text-anchor="start" font-weight="600">lineitem</text>
    <rect x="640" y="132" width="96" height="22" rx="4" fill="#DDE8FF" stroke="#7FA6EE"/><text x="688" y="147">&lt; 20M</text>
    <rect x="742" y="132" width="96" height="22" rx="4" fill="#FFE1D6" stroke="#E8957A"/><text x="790" y="147">20M-40M</text>
    <rect x="844" y="132" width="96" height="22" rx="4" fill="#E8DDFF" stroke="#A88BE6"/><text x="892" y="147">&#8805; 40M</text>
    <text x="560" y="186" text-anchor="start" font-weight="600">orders</text>
    <rect x="640" y="172" width="96" height="22" rx="4" fill="#DDE8FF" stroke="#7FA6EE"/><text x="688" y="187">&lt; 20M</text>
    <rect x="742" y="172" width="96" height="22" rx="4" fill="#FFE1D6" stroke="#E8957A"/><text x="790" y="187">20M-40M</text>
    <rect x="844" y="172" width="96" height="22" rx="4" fill="#E8DDFF" stroke="#A88BE6"/><text x="892" y="187">&#8805; 40M</text>
  </g>
  <g font-size="12" text-anchor="middle">
    <rect x="550" y="230" width="124" height="70" rx="8" fill="#DDE8FF" stroke="#7FA6EE"/>
    <text x="612" y="258" font-weight="700" fill="#1F2328">Task 1</text>
    <text x="612" y="280" fill="#57606A">&lt; 20M</text>
    <rect x="678" y="230" width="124" height="70" rx="8" fill="#FFE1D6" stroke="#E8957A"/>
    <text x="740" y="258" font-weight="700" fill="#1F2328">Task 2</text>
    <text x="740" y="280" fill="#57606A">20M-40M</text>
    <rect x="806" y="230" width="124" height="70" rx="8" fill="#E8DDFF" stroke="#A88BE6"/>
    <text x="868" y="258" font-weight="700" fill="#1F2328">Task 3</text>
    <text x="868" y="280" fill="#57606A">&#8805; 40M</text>
  </g>
</svg>
