<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8C959F"/>
    </marker>
  </defs>
  <rect width="1000" height="480" rx="16" fill="#FFFDF7"/>
  <text x="40" y="46" font-size="20" font-weight="700" fill="#1F2328">Today every commit is logged twice</text>

  <text x="40" y="88" font-size="14" font-weight="600" fill="#8C7A4B">TODAY</text>

  <!-- Commit row -->
  <g text-anchor="middle">
    <rect x="40" y="104" width="150" height="60" rx="10" fill="#F3F1EA" stroke="#D8D3C4"/>
    <text x="115" y="140" font-size="16" font-weight="700" fill="#1F2328">COMMIT</text>

    <rect x="240" y="104" width="200" height="60" rx="10" fill="#FFF1C2" stroke="#E3B341"/>
    <text x="340" y="130" font-size="15" font-weight="700" fill="#1F2328">DuckDB WAL</text>
    <text x="340" y="150" font-size="12" fill="#57606A" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">db.wal + fsync</text>

    <rect x="490" y="104" width="200" height="60" rx="10" fill="#FFF1C2" stroke="#E3B341"/>
    <text x="590" y="130" font-size="15" font-weight="700" fill="#1F2328">SlateDB WAL</text>
    <text x="590" y="150" font-size="12" fill="#57606A">object in the bucket</text>

    <rect x="740" y="104" width="220" height="60" rx="10" fill="#DDE8FF" stroke="#7FA6EE"/>
    <text x="850" y="140" font-size="15" font-weight="700" fill="#1F2328">memtable &#8594; SST</text>

    <!-- Checkpoint row -->
    <rect x="40" y="200" width="150" height="60" rx="10" fill="#F3F1EA" stroke="#D8D3C4"/>
    <text x="115" y="236" font-size="16" font-weight="700" fill="#1F2328">CHECKPOINT</text>

    <rect x="240" y="200" width="200" height="60" rx="10" fill="#F3F1EA" stroke="#D8D3C4"/>
    <text x="340" y="226" font-size="15" font-weight="700" fill="#1F2328">changed blocks</text>
    <text x="340" y="246" font-size="12" fill="#57606A">into the database file</text>

    <rect x="490" y="200" width="200" height="60" rx="10" fill="#FFF1C2" stroke="#E3B341"/>
    <text x="590" y="226" font-size="15" font-weight="700" fill="#1F2328">SlateDB WAL</text>
    <text x="590" y="246" font-size="12" fill="#57606A">again</text>

    <rect x="740" y="200" width="220" height="60" rx="10" fill="#DDE8FF" stroke="#7FA6EE"/>
    <text x="850" y="236" font-size="15" font-weight="700" fill="#1F2328">memtable &#8594; SST</text>
  </g>
  <g stroke="#8C959F" stroke-width="2" marker-end="url(#arrow)">
    <line x1="194" y1="134" x2="232" y2="134"/>
    <line x1="444" y1="134" x2="482" y2="134"/>
    <line x1="694" y1="134" x2="732" y2="134"/>
    <line x1="194" y1="230" x2="232" y2="230"/>
    <line x1="444" y1="230" x2="482" y2="230"/>
    <line x1="694" y1="230" x2="732" y2="230"/>
  </g>
  <text x="465" y="186" font-size="13" text-anchor="middle" fill="#9A6700" font-weight="600">two logs, two durability points for the same commit</text>

  <line x1="40" y1="294" x2="960" y2="294" stroke="#E6E1D3"/>

  <!-- Planned -->
  <text x="40" y="328" font-size="14" font-weight="600" fill="#8C7A4B">PLANNED: ONE LOG OWNS DURABILITY</text>
  <rect x="40" y="344" width="440" height="100" rx="12" fill="#E3F4E6" stroke="#7CC08A"/>
  <text x="62" y="376" font-size="14" font-weight="600" fill="#2D6A3E">OPTION A</text>
  <text x="62" y="402" font-size="16" font-weight="700" fill="#1F2328">SlateDB's WAL is the commit log</text>
  <text x="62" y="426" font-size="14" fill="#57606A">DuckDB's WAL no longer persisted separately</text>

  <rect x="520" y="344" width="440" height="100" rx="12" fill="#E3F4E6" stroke="#7CC08A"/>
  <text x="542" y="376" font-size="14" font-weight="600" fill="#2D6A3E">OPTION B</text>
  <text x="542" y="402" font-size="16" font-weight="700" fill="#1F2328">DuckDB's WAL stays authoritative</text>
  <text x="542" y="426" font-size="14" fill="#57606A">block writes skip SlateDB's WAL</text>
</svg>
