<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8C959F"/>
    </marker>
  </defs>
  <rect width="1000" height="470" rx="16" fill="#FFFDF7"/>
  <text x="40" y="46" font-size="20" font-weight="700" fill="#1F2328">DuckDB measures each column segment, then keeps the smallest</text>
  <text x="340" y="86" font-size="14" font-weight="600" fill="#8C7A4B">AT CHECKPOINT, EVERY CANDIDATE ESTIMATES ITS SIZE</text>

  <!-- Column A -->
  <rect x="40" y="104" width="230" height="140" rx="10" fill="#F3F1EA" stroke="#D8D3C4"/>
  <text x="58" y="130" font-size="14" font-weight="700" fill="#1F2328">event_time <tspan font-weight="400" fill="#57606A">TIMESTAMP</tspan></text>
  <g font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#57606A">
    <text x="58" y="158">09:00:01.120</text>
    <text x="58" y="180">09:00:01.180</text>
    <text x="58" y="202">09:00:01.230</text>
    <text x="58" y="224">&#8230; sorted</text>
  </g>
  <line x1="276" y1="174" x2="326" y2="174" stroke="#8C959F" stroke-width="2" marker-end="url(#arrow)"/>

  <g font-size="14" fill="#1F2328" text-anchor="end">
    <text x="470" y="129">Uncompressed</text>
    <text x="470" y="169">RLE</text>
    <text x="470" y="209">Bit-packing (delta)</text>
  </g>
  <rect x="484" y="112" width="400" height="24" rx="5" fill="#E6E1D3"/>
  <rect x="484" y="152" width="390" height="24" rx="5" fill="#E6E1D3"/>
  <rect x="484" y="192" width="64" height="24" rx="5" fill="#7CC08A"/>
  <text x="560" y="209" font-size="14" font-weight="700" fill="#1A7F37">&#10003; kept</text>

  <!-- Column B -->
  <rect x="40" y="270" width="230" height="140" rx="10" fill="#F3F1EA" stroke="#D8D3C4"/>
  <text x="58" y="296" font-size="14" font-weight="700" fill="#1F2328">status <tspan font-weight="400" fill="#57606A">VARCHAR</tspan></text>
  <g font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#57606A">
    <text x="58" y="324">'shipped'</text>
    <text x="58" y="346">'shipped'</text>
    <text x="58" y="368">'returned'</text>
    <text x="58" y="390">&#8230; few distinct</text>
  </g>
  <line x1="276" y1="340" x2="326" y2="340" stroke="#8C959F" stroke-width="2" marker-end="url(#arrow)"/>

  <g font-size="14" fill="#1F2328" text-anchor="end">
    <text x="470" y="295">Uncompressed</text>
    <text x="470" y="335">FSST</text>
    <text x="470" y="375">Dictionary</text>
  </g>
  <rect x="484" y="278" width="400" height="24" rx="5" fill="#E6E1D3"/>
  <rect x="484" y="318" width="210" height="24" rx="5" fill="#E6E1D3"/>
  <rect x="484" y="358" width="52" height="24" rx="5" fill="#7CC08A"/>
  <text x="548" y="375" font-size="14" font-weight="700" fill="#1A7F37">&#10003; kept</text>

  <text x="40" y="446" font-size="13" fill="#57606A">Illustrative sizes. The choice is made again for every row group, so it follows the data as it changes.</text>
</svg>
