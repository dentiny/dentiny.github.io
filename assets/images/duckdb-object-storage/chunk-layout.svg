<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8C959F"/>
    </marker>
  </defs>
  <rect width="1000" height="540" rx="16" fill="#FFFDF7"/>
  <text x="40" y="46" font-size="20" font-weight="700" fill="#1F2328">Every DuckDB block is exactly one key</text>

  <text x="40" y="88" font-size="14" font-weight="600" fill="#8C7A4B">DATABASE.DB, AS DUCKDB SEES IT</text>
  <g font-size="15" text-anchor="middle">
    <rect x="40" y="100" width="64" height="58" rx="6" fill="#FFE8E5" stroke="#E5898A"/>
    <text x="72" y="125" font-weight="600" fill="#1F2328">header</text>
    <text x="72" y="145" font-size="13" fill="#57606A">12 KiB</text>

    <rect x="108" y="100" width="196" height="58" rx="6" fill="#FFF1C2" stroke="#E3B341"/>
    <text x="206" y="125" font-weight="600" fill="#1F2328">block 0</text>
    <text x="206" y="145" font-size="13" fill="#57606A">256 KiB</text>

    <rect x="308" y="100" width="196" height="58" rx="6" fill="#FFF1C2" stroke="#E3B341"/>
    <text x="406" y="125" font-weight="600" fill="#1F2328">block 1</text>
    <text x="406" y="145" font-size="13" fill="#57606A">256 KiB</text>

    <rect x="508" y="100" width="196" height="58" rx="6" fill="#FFF1C2" stroke="#E3B341"/>
    <text x="606" y="125" font-weight="600" fill="#1F2328">block 2</text>
    <text x="606" y="145" font-size="13" fill="#57606A">256 KiB</text>

    <rect x="708" y="100" width="100" height="58" rx="6" fill="none" stroke="#B9B2A0" stroke-dasharray="5 4"/>
    <text x="758" y="135" font-weight="600" fill="#8C959F">&#8230;</text>
  </g>
  <g font-size="12" fill="#8C959F">
    <text x="40" y="176">0</text>
    <text x="108" y="176">12 KiB</text>
    <text x="308" y="176">268 KiB</text>
    <text x="508" y="176">524 KiB</text>
  </g>

  <!-- Callout -->
  <rect x="836" y="100" width="124" height="134" rx="10" fill="#E3F4E6" stroke="#7CC08A"/>
  <g font-size="14" text-anchor="middle" fill="#1F2328">
    <text x="898" y="130" font-weight="700">write a block</text>
    <text x="898" y="150" fill="#57606A">= one put</text>
    <text x="898" y="190" font-weight="700">read a block</text>
    <text x="898" y="210" fill="#57606A">= one get</text>
  </g>

  <!-- Arrows block -> key -->
  <g stroke="#8C959F" stroke-width="2" marker-end="url(#arrow)">
    <line x1="72" y1="184" x2="72" y2="222"/>
    <line x1="206" y1="184" x2="206" y2="222"/>
    <line x1="406" y1="184" x2="406" y2="222"/>
    <line x1="606" y1="184" x2="606" y2="222"/>
  </g>

  <text x="40" y="288" font-size="14" font-weight="600" fill="#8C7A4B">SLATEDB KEYS</text>
  <g font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#1F2328">
    <rect x="36" y="228" width="68" height="40" rx="6" fill="#F3F1EA" stroke="#D8D3C4"/>
    <text x="72" y="253">c/1/0</text>
    <rect x="108" y="228" width="196" height="40" rx="6" fill="#F3F1EA" stroke="#D8D3C4"/>
    <text x="206" y="253">c/1/1</text>
    <rect x="308" y="228" width="196" height="40" rx="6" fill="#F3F1EA" stroke="#D8D3C4"/>
    <text x="406" y="253">c/1/2</text>
    <rect x="508" y="228" width="196" height="40" rx="6" fill="#F3F1EA" stroke="#D8D3C4"/>
    <text x="606" y="253">c/1/3</text>
  </g>

  <!-- Key families -->
  <line x1="40" y1="316" x2="960" y2="316" stroke="#E6E1D3"/>
  <text x="40" y="350" font-size="14" font-weight="600" fill="#8C7A4B">THREE KEY FAMILIES PER DATABASE</text>
  <g font-size="15">
    <rect x="40" y="366" width="920" height="46" rx="8" fill="#F8F6EF"/>
    <text x="60" y="395" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#1F2328">p/database.db</text>
    <text x="300" y="395" fill="#57606A">&#8594;  file ID 1</text>
    <text x="940" y="395" text-anchor="end" font-weight="600" fill="#1F2328">path</text>

    <rect x="40" y="420" width="920" height="46" rx="8" fill="#F8F6EF"/>
    <text x="60" y="449" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#1F2328">m/1</text>
    <text x="300" y="449" fill="#57606A">&#8594;  size, mtime, chunk size 256 KiB, chunk base offset 12 KiB</text>
    <text x="940" y="449" text-anchor="end" font-weight="600" fill="#1F2328">metadata</text>

    <rect x="40" y="474" width="920" height="46" rx="8" fill="#F8F6EF"/>
    <text x="60" y="503" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#1F2328">c/1/&lt;chunk&gt;</text>
    <text x="300" y="503" fill="#57606A">&#8594;  up to 256 KiB of file content</text>
    <text x="940" y="503" text-anchor="end" font-weight="600" fill="#1F2328">content</text>
  </g>
</svg>
