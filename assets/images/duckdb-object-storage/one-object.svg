<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="1000" height="400" rx="16" fill="#FFFDF7"/>
  <text x="40" y="46" font-size="20" font-weight="700" fill="#1F2328">Changing one 256 KiB block</text>

  <!-- Left: one object -->
  <rect x="40" y="70" width="440" height="300" rx="12" fill="#FFF5F5" stroke="#E5898A"/>
  <text x="62" y="102" font-size="14" font-weight="600" fill="#A0111F">ONE OBJECT PER FILE</text>
  <g fill="#F3E3E3" stroke="#E5BDBD">
    <rect x="62" y="122" width="44" height="24" rx="3"/><rect x="112" y="122" width="44" height="24" rx="3"/><rect x="162" y="122" width="44" height="24" rx="3"/><rect x="212" y="122" width="44" height="24" rx="3"/><rect x="262" y="122" width="44" height="24" rx="3"/><rect x="312" y="122" width="44" height="24" rx="3"/><rect x="362" y="122" width="44" height="24" rx="3"/><rect x="412" y="122" width="44" height="24" rx="3"/>
    <rect x="62" y="152" width="44" height="24" rx="3"/><rect x="112" y="152" width="44" height="24" rx="3"/><rect x="162" y="152" width="44" height="24" rx="3"/><rect x="212" y="152" width="44" height="24" rx="3"/><rect x="262" y="152" width="44" height="24" rx="3"/><rect x="312" y="152" width="44" height="24" rx="3"/><rect x="362" y="152" width="44" height="24" rx="3"/><rect x="412" y="152" width="44" height="24" rx="3"/>
    <rect x="62" y="182" width="44" height="24" rx="3"/><rect x="112" y="182" width="44" height="24" rx="3"/><rect x="162" y="182" width="44" height="24" rx="3"/><rect x="212" y="182" width="44" height="24" rx="3"/><rect x="262" y="182" width="44" height="24" rx="3"/><rect x="312" y="182" width="44" height="24" rx="3"/><rect x="362" y="182" width="44" height="24" rx="3"/><rect x="412" y="182" width="44" height="24" rx="3"/>
    <rect x="62" y="212" width="44" height="24" rx="3"/><rect x="112" y="212" width="44" height="24" rx="3"/><rect x="162" y="212" width="44" height="24" rx="3"/><rect x="212" y="212" width="44" height="24" rx="3"/><rect x="262" y="212" width="44" height="24" rx="3"/><rect x="312" y="212" width="44" height="24" rx="3"/><rect x="362" y="212" width="44" height="24" rx="3"/><rect x="412" y="212" width="44" height="24" rx="3"/>
  </g>
  <rect x="262" y="152" width="44" height="24" rx="3" fill="#CF222E"/>
  <text x="62" y="282" font-size="16" font-weight="700" fill="#1F2328">Objects are immutable.</text>
  <text x="62" y="310" font-size="15" fill="#A0111F">Rewrite the whole 20 GB object</text>
  <text x="62" y="334" font-size="15" fill="#A0111F">to change one block.</text>

  <!-- Right: SlateDB -->
  <rect x="520" y="70" width="440" height="300" rx="12" fill="#E3F4E6" stroke="#7CC08A"/>
  <text x="542" y="102" font-size="14" font-weight="600" fill="#2D6A3E">SLATEDB: ONE KEY PER BLOCK</text>
  <g font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#57606A">
    <text x="542" y="138">c/1/0</text>
    <text x="542" y="162">c/1/1</text>
    <text x="542" y="210">c/1/3</text>
    <text x="542" y="234">&#8230;</text>
  </g>
  <rect x="536" y="168" width="200" height="26" rx="5" fill="#7CC08A"/>
  <text x="542" y="186" xml:space="preserve" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#FFFFFF">c/1/2  put</text>
  <text x="542" y="282" font-size="16" font-weight="700" fill="#1F2328">One small batched write.</text>
  <text x="542" y="310" font-size="15" fill="#2D6A3E">Compaction drops the old version</text>
  <text x="542" y="334" font-size="15" fill="#2D6A3E">later, in the background.</text>
</svg>
