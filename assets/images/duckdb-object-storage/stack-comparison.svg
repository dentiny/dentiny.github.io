<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8C959F"/>
    </marker>
  </defs>
  <rect width="1000" height="480" rx="16" fill="#FFFDF7"/>
  <text x="40" y="46" font-size="20" font-weight="700" fill="#1F2328">What you run to keep a database in object storage</text>

  <!-- Column headers -->
  <text x="180" y="92" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2328">Iceberg</text>
  <text x="500" y="92" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2328">DuckLake</text>
  <text x="820" y="92" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2328">duckdb_object_storage</text>

  <!-- Engine row -->
  <g font-size="15" text-anchor="middle">
    <rect x="40" y="110" width="280" height="70" rx="10" fill="#F3F1EA" stroke="#D8D3C4"/>
    <text x="180" y="140" font-weight="600" fill="#1F2328">Query engine</text>
    <text x="180" y="162" fill="#57606A">DuckDB, Spark, Trino, &#8230;</text>

    <rect x="360" y="110" width="280" height="70" rx="10" fill="#F3F1EA" stroke="#D8D3C4"/>
    <text x="500" y="140" font-weight="600" fill="#1F2328">DuckDB</text>
    <text x="500" y="162" fill="#57606A">+ ducklake extension</text>

    <rect x="680" y="110" width="280" height="70" rx="10" fill="#FFF1C2" stroke="#E3B341"/>
    <text x="820" y="140" font-weight="600" fill="#1F2328">DuckDB</text>
    <text x="820" y="162" fill="#57606A">+ duckdb_object_storage</text>
  </g>

  <!-- Arrows engine -> middle -->
  <g stroke="#8C959F" stroke-width="2" marker-end="url(#arrow)">
    <line x1="180" y1="182" x2="180" y2="204"/>
    <line x1="500" y1="182" x2="500" y2="204"/>
    <line x1="820" y1="182" x2="820" y2="204"/>
  </g>

  <!-- Middle row: the extra service -->
  <g font-size="15" text-anchor="middle">
    <rect x="40" y="210" width="280" height="80" rx="10" fill="#FFE8E5" stroke="#E5898A"/>
    <text x="180" y="244" font-weight="600" fill="#1F2328">Catalog service</text>
    <text x="180" y="266" fill="#57606A">REST catalog, Glue, Polaris, &#8230;</text>

    <rect x="360" y="210" width="280" height="80" rx="10" fill="#FFE8E5" stroke="#E5898A"/>
    <text x="500" y="244" font-weight="600" fill="#1F2328">Catalog database</text>
    <text x="500" y="266" fill="#57606A">PostgreSQL or MySQL</text>

    <rect x="680" y="210" width="280" height="80" rx="10" fill="none" stroke="#8C959F" stroke-dasharray="6 5"/>
    <text x="820" y="244" font-weight="600" fill="#57606A">Nothing to run</text>
    <text x="820" y="266" fill="#8C959F">metadata lives in the bucket</text>
  </g>

  <!-- Arrows middle -> storage -->
  <g stroke="#8C959F" stroke-width="2" marker-end="url(#arrow)">
    <line x1="180" y1="292" x2="180" y2="314"/>
    <line x1="500" y1="292" x2="500" y2="314"/>
    <line x1="820" y1="292" x2="820" y2="314"/>
  </g>

  <!-- Storage row -->
  <g font-size="15" text-anchor="middle">
    <rect x="40" y="320" width="280" height="80" rx="10" fill="#DDE8FF" stroke="#7FA6EE"/>
    <text x="180" y="354" font-weight="600" fill="#1F2328">Object storage</text>
    <text x="180" y="376" fill="#57606A">Parquet + Iceberg metadata</text>

    <rect x="360" y="320" width="280" height="80" rx="10" fill="#DDE8FF" stroke="#7FA6EE"/>
    <text x="500" y="354" font-weight="600" fill="#1F2328">Object storage</text>
    <text x="500" y="376" fill="#57606A">Parquet files</text>

    <rect x="680" y="320" width="280" height="80" rx="10" fill="#DDE8FF" stroke="#7FA6EE"/>
    <text x="820" y="354" font-weight="600" fill="#1F2328">Object storage</text>
    <text x="820" y="376" fill="#57606A">a native DuckDB database</text>
  </g>

  <!-- Footer counts -->
  <line x1="40" y1="420" x2="960" y2="420" stroke="#E6E1D3"/>
  <g font-size="15" text-anchor="middle" fill="#57606A">
    <text x="180" y="452">Extra services: <tspan font-weight="700" fill="#CF222E">1</tspan></text>
    <text x="500" y="452">Extra services: <tspan font-weight="700" fill="#CF222E">1</tspan></text>
    <text x="820" y="452">Extra services: <tspan font-weight="700" fill="#1A7F37">0</tspan></text>
  </g>
</svg>
